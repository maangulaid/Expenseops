version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expenseops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenseops}
      POSTGRES_USER: ${POSTGRES_USER:-expenseops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenseops_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expenseops_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expenseops-network

  redis:
    image: redis:7-alpine
    container_name: expenseops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expenseops-network

  minio:
    image: minio/minio:latest
    container_name: expenseops-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - expenseops-network

  createbuckets:
    image: minio/mc:latest
    container_name: expenseops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb myminio/receipts-raw --ignore-existing;
      /usr/bin/mc anonymous set download myminio/receipts-raw;
      exit 0;
      "
    networks:
      - expenseops-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: expenseops-api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-expenseops_user}:${POSTGRES_PASSWORD:-expenseops_password}@postgres:5432/${POSTGRES_DB:-expenseops}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        python -m app.scripts.seed_data &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - expenseops-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: expenseops-worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-expenseops_user}:${POSTGRES_PASSWORD:-expenseops_password}@postgres:5432/${POSTGRES_DB:-expenseops}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      - api
      - redis
      - postgres
      - minio
    volumes:
      - ./worker:/app
    command: celery -A app.celery_app worker --loglevel=info --queues=receipts --concurrency=2
    networks:
      - expenseops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expenseops-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - expenseops-network

volumes:
  postgres_data:
  minio_data:

networks:
  expenseops-network:
    driver: bridge
